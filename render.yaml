services:
  - type: web
    name: aidex-backend
    runtime: node
    buildCommand: npm install --prefix server
    startCommand: npm --prefix server start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
